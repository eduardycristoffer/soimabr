<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3E74B6" />
  <title>Sem conexão — SOIMA BR</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f8fa; color: #1b2330;
    }
    @media (prefers-color-scheme: dark) { body { background: #10141c; color: #e8ecf3; } .card { background: #171c26 !important; border-color: #2a3140 !important; } p { color: #aab3c2 !important; } }
    .card { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e3e7ee; border-radius: 16px; padding: 32px 28px; }
    .icon { width: 56px; height: 56px; border-radius: 14px; background: #3E74B6; display: grid; place-items: center; margin: 0 auto 18px; }
    .icon svg { width: 30px; height: 30px; stroke: #fff; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; line-height: 1.5; color: #5a6475; font-size: 15px; }
    button { font: inherit; font-weight: 600; background: #3E74B6; color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #9ec5f4; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
    </div>
    <h1>Sem conexão com a internet</h1>
    <p>O sistema precisa de internet para mostrar propostas, contratos e clientes. Confira sua conexão e tente de novo — nada do que você já salvou foi perdido.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
